<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="system-ui, sans-serif">
  <!-- Copyright (C) 2026 Marcel Petrick. SPDX-License-Identifier: GPL-3.0-or-later. Screen 03: Mark table -->
  <rect width="390" height="844" rx="28" fill="#F7F2E8"/>
  <text x="24" y="30" font-size="13" fill="#6B7570">9:41</text>
  <text x="24" y="74" font-size="24" font-weight="600" fill="#1F2A26">Mark the table</text>
  <text x="24" y="98" font-size="14" fill="#6B7570">Step 2 of 3 · tap the four corners in order</text>

  <!-- preview, taller here (portrait crop of the same 16:9 frame, letterboxed) -->
  <rect x="20" y="112" width="350" height="420" rx="16" fill="#2B2F2D"/>
  <rect x="20" y="112" width="350" height="60" fill="#1F2321"/>
  <rect x="20" y="472" width="350" height="60" fill="#1F2321"/>
  <text x="34" y="132" font-size="11" fill="#CFD6D2">Letterbox: taps here are ignored</text>
  <!-- table polygon (tablecloth) -->
  <path d="M84 300 L306 300 L336 440 L54 440 Z" fill="#286552" fill-opacity="0.28" stroke="#9FD9BF" stroke-width="2"/>
  <!-- handles -->
  <g font-size="12" font-weight="600" text-anchor="middle">
    <circle cx="84" cy="300" r="14" fill="#FFFDF9" stroke="#286552" stroke-width="2"/><text x="84" y="304" fill="#286552">1</text>
    <circle cx="306" cy="300" r="14" fill="#FFFDF9" stroke="#286552" stroke-width="2"/><text x="306" y="304" fill="#286552">2</text>
    <circle cx="336" cy="440" r="14" fill="#FFFDF9" stroke="#286552" stroke-width="2"/><text x="336" y="444" fill="#286552">3</text>
    <circle cx="54" cy="440" r="14" fill="#286552" stroke="#FFFDF9" stroke-width="2"/><text x="54" y="444" fill="#FFFFFF">4</text>
  </g>
  <!-- loupe above the pressed handle 4 -->
  <circle cx="54" cy="372" r="34" fill="#3A403C" stroke="#FFFDF9" stroke-width="3"/>
  <path d="M30 388 L78 388" stroke="#9FD9BF" stroke-width="3"/>
  <path d="M54 356 L54 388" stroke="#FFFDF9" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="54" cy="372" r="4" fill="#FFFDF9"/>
  <text x="96" y="368" font-size="10" fill="#CFD6D2">loupe while</text>
  <text x="96" y="380" font-size="10" fill="#CFD6D2">dragging</text>

  <!-- hint -->
  <rect x="20" y="548" width="350" height="56" rx="16" fill="#DCEBE3"/>
  <text x="36" y="572" font-size="15" font-weight="600" fill="#286552">Four corners marked</text>
  <text x="36" y="592" font-size="13" fill="#1F2A26">Drag a number to adjust. The green area is the tabletop.</text>

  <!-- error variant -->
  <rect x="20" y="618" width="350" height="44" rx="12" fill="#F4DAD6"/>
  <text x="36" y="645" font-size="13" fill="#7F1D17">Error: "Corners must not cross — tap Reset and try again."</text>

  <!-- bottom bar -->
  <rect x="20" y="700" width="104" height="48" rx="16" fill="none" stroke="#286552" stroke-width="2"/>
  <text x="72" y="730" font-size="15" text-anchor="middle" fill="#286552">Undo</text>
  <rect x="136" y="700" width="104" height="48" rx="16" fill="none" stroke="#286552" stroke-width="2"/>
  <text x="188" y="730" font-size="15" text-anchor="middle" fill="#286552">Reset</text>
  <rect x="252" y="696" width="118" height="56" rx="16" fill="#286552"/>
  <text x="311" y="731" font-size="17" font-weight="600" text-anchor="middle" fill="#FFFFFF">Continue</text>
  <text x="195" y="800" font-size="12" text-anchor="middle" fill="#6B7570">Stored in image coordinates with camera id and orientation,</text>
  <text x="195" y="818" font-size="12" text-anchor="middle" fill="#6B7570">so a layout change never invalidates it.</text>
</svg>
