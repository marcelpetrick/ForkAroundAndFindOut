<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="system-ui, sans-serif">
  <!-- Copyright (C) 2026 Marcel Petrick. SPDX-License-Identifier: GPL-3.0-or-later. Screen 06: Reminder (default static perimeter) -->
  <rect width="390" height="844" rx="28" fill="#F7F2E8"/>
  <!-- static perimeter 12dp, soft red, no flashing -->
  <rect x="6" y="6" width="378" height="832" rx="24" fill="none" stroke="#B3261E" stroke-opacity="0.85" stroke-width="12"/>
  <text x="24" y="30" font-size="13" fill="#6B7570">9:41</text>
  <text x="24" y="74" font-size="24" font-weight="600" fill="#1F2A26">Dinner</text>
  <text x="24" y="98" font-size="14" fill="#6B7570">14 min · 2 reminders</text>

  <!-- preview -->
  <rect x="20" y="112" width="350" height="197" rx="16" fill="#2B2F2D"/>
  <path d="M70 240 L320 240 L340 300 L50 300 Z" fill="none" stroke="#9FD9BF" stroke-width="1.5" stroke-opacity="0.7"/>
  <g stroke="#9FD9BF" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="135" cy="160" r="12"/><path d="M110 190 L160 190 M110 190 L98 232 L112 246 M160 190 L172 232 L158 246"/>
  </g>
  <g stroke="#E5766B" stroke-width="2.5" fill="none" stroke-linecap="round">
    <circle cx="260" cy="165" r="12"/><path d="M235 195 L285 195 M235 195 L228 248 L244 216 M285 195 L298 236 L282 248"/>
    <circle cx="228" cy="248" r="7" fill="#B3261E" stroke="none"/>
  </g>

  <!-- reminder card -->
  <rect x="32" y="336" width="326" height="132" rx="20" fill="#F4DAD6"/>
  <circle cx="64" cy="372" r="10" fill="#3E6FA8"/>
  <text x="84" y="378" font-size="15" font-weight="600" fill="#7F1D17">Seat 2 · left elbow</text>
  <text x="195" y="418" font-size="22" font-weight="600" text-anchor="middle" fill="#1F2A26">Elbows off the table, please</text>
  <text x="195" y="446" font-size="13" text-anchor="middle" fill="#6B7570">Clears by itself once the elbow is off for half a second</text>

  <!-- seat cards -->
  <rect x="20" y="486" width="169" height="96" rx="20" fill="#FFFDF9" stroke="#E4DCCB"/>
  <circle cx="44" cy="512" r="8" fill="#286552"/><text x="60" y="517" font-size="15" font-weight="600" fill="#1F2A26">Seat 1</text>
  <rect x="34" y="534" width="66" height="30" rx="15" fill="#DCEBE3"/><text x="67" y="554" font-size="13" text-anchor="middle" fill="#286552">L ✓</text>
  <rect x="108" y="534" width="66" height="30" rx="15" fill="#DCEBE3"/><text x="141" y="554" font-size="13" text-anchor="middle" fill="#286552">R ✓</text>
  <rect x="201" y="486" width="169" height="96" rx="20" fill="#FFFDF9" stroke="#B3261E"/>
  <circle cx="225" cy="512" r="8" fill="#3E6FA8"/><text x="241" y="517" font-size="15" font-weight="600" fill="#1F2A26">Seat 2</text>
  <rect x="215" y="534" width="66" height="30" rx="15" fill="#F4DAD6"/><text x="248" y="554" font-size="13" font-weight="600" text-anchor="middle" fill="#7F1D17">L Elbow</text>
  <rect x="289" y="534" width="66" height="30" rx="15" fill="#DCEBE3"/><text x="322" y="554" font-size="13" text-anchor="middle" fill="#286552">R ✓</text>

  <!-- adult feedback row (diagnostics on) -->
  <rect x="20" y="600" width="169" height="44" rx="14" fill="none" stroke="#6B7570" stroke-dasharray="4 3"/>
  <text x="104" y="627" font-size="14" text-anchor="middle" fill="#6B7570">False alarm</text>
  <rect x="201" y="600" width="169" height="44" rx="14" fill="none" stroke="#6B7570" stroke-dasharray="4 3"/>
  <text x="285" y="627" font-size="14" text-anchor="middle" fill="#6B7570">Missed one</text>
  <text x="195" y="662" font-size="11" text-anchor="middle" fill="#6B7570">Adult row only with diagnostics on.</text>
  <text x="195" y="678" font-size="11" text-anchor="middle" fill="#6B7570">A false-alarm tap silences that seat for 30 s and is logged.</text>

  <!-- pause stays -->
  <rect x="20" y="700" width="350" height="56" rx="16" fill="#1F2A26"/>
  <text x="195" y="735" font-size="18" font-weight="600" text-anchor="middle" fill="#FFFFFF">▮▮  Pause</text>
  <text x="195" y="790" font-size="12" text-anchor="middle" fill="#6B7570">Other modes: icon only · soft tint · slow pulse (2.4 s).</text>
  <text x="195" y="810" font-size="12" text-anchor="middle" fill="#6B7570">Chime: two soft notes; once / every N s / continuous.</text>
</svg>
