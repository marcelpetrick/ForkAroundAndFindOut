    <rect x="316" y="628" width="38" height="20" rx="10" fill="#E4DCCB"/><circle cx="326" cy="638" r="8" fill="#FFF"/>

    <!-- Seats / Data / Language / About rows -->
    <rect x="20" y="664" width="350" height="150" rx="20" fill="#FFFDF9" stroke="#E4DCCB"/>
