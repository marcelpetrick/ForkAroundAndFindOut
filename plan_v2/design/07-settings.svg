    <line x1="36" y1="280" x2="354" y2="280" stroke="#E4DCCB"/>
    <text x="36" y="306">Volume</text>
    <rect x="110" y="300" width="180" height="6" rx="3" fill="#E4DCCB"/><rect x="110" y="300" width="72" height="6" rx="3" fill="#286552"/><circle cx="182" cy="303" r="10" fill="#286552"/>
    <circle cx="330" cy="303" r="14" fill="#DCEBE3"/><text x="330" y="308" font-size="12" text-anchor="middle" fill="#286552">▶</text>
    <text x="36" y="338" font-size="13" fill="#6B7570">Quiet start: no reminders in the first 3 s of a session</text>

