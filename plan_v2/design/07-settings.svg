    <text x="36" y="170" font-size="13" fill="#6B7570">Red frame (default) · Icon only · Soft tint · Slow pulse</text>
    <rect x="36" y="180" width="94" height="26" rx="13" fill="#286552"/><text x="83" y="198" font-size="13" text-anchor="middle" fill="#FFF">Red frame</text>
    <rect x="138" y="180" width="70" height="26" rx="13" fill="none" stroke="#E4DCCB"/><text x="173" y="198" font-size="13" text-anchor="middle" fill="#1F2A26">Icon</text>
    <rect x="216" y="180" width="60" height="26" rx="13" fill="none" stroke="#E4DCCB"/><text x="246" y="198" font-size="13" text-anchor="middle" fill="#1F2A26">Tint</text>
    <rect x="284" y="180" width="70" height="26" rx="13" fill="none" stroke="#E4DCCB"/><text x="319" y="198" font-size="13" text-anchor="middle" fill="#1F2A26">Pulse</text>
    <line x1="36" y1="218" x2="354" y2="218" stroke="#E4DCCB"/>
