<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="system-ui, sans-serif">
  <!-- Copyright (C) 2026 Marcel Petrick. SPDX-License-Identifier: GPL-3.0-or-later. Navigation flow -->
  <rect width="900" height="420" fill="#F7F2E8"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B7570"/>
    </marker>
  </defs>
  <g font-size="14" text-anchor="middle" fill="#1F2A26">
    <!-- setup row -->
    <rect x="30" y="60" width="130" height="56" rx="16" fill="#FFFDF9" stroke="#286552" stroke-width="2"/>
    <text x="95" y="84">01 Welcome</text><text x="95" y="102" font-size="11" fill="#6B7570">/ Ready</text>
    <rect x="200" y="60" width="130" height="56" rx="16" fill="#FFFDF9" stroke="#E4DCCB"/>
    <text x="265" y="84">02 Position</text><text x="265" y="102" font-size="11" fill="#6B7570">visibility check</text>
    <rect x="370" y="60" width="130" height="56" rx="16" fill="#FFFDF9" stroke="#E4DCCB"/>
    <text x="435" y="84">03 Mark table</text><text x="435" y="102" font-size="11" fill="#6B7570">4 corners</text>
    <rect x="540" y="60" width="130" height="56" rx="16" fill="#FFFDF9" stroke="#E4DCCB" stroke-dasharray="6 4"/>
    <text x="605" y="84">04 Seats</text><text x="605" y="102" font-size="11" fill="#6B7570">optional</text>
    <rect x="720" y="60" width="150" height="56" rx="16" fill="#DCEBE3" stroke="#286552" stroke-width="2"/>
    <text x="795" y="84" font-weight="600">05 Monitor</text><text x="795" y="102" font-size="11" fill="#6B7570">Pause always visible</text>

    <line x1="160" y1="88" x2="200" y2="88" stroke="#6B7570" stroke-width="2" marker-end="url(#a)"/>
    <line x1="330" y1="88" x2="370" y2="88" stroke="#6B7570" stroke-width="2" marker-end="url(#a)"/>
    <line x1="500" y1="88" x2="540" y2="88" stroke="#6B7570" stroke-width="2" marker-end="url(#a)"/>
    <line x1="670" y1="88" x2="720" y2="88" stroke="#6B7570" stroke-width="2" marker-end="url(#a)"/>

    <!-- reminder -->
    <rect x="720" y="160" width="150" height="56" rx="16" fill="#F4DAD6" stroke="#B3261E"/>
    <text x="795" y="184">06 Reminder</text><text x="795" y="202" font-size="11" fill="#6B7570">auto-clears</text>
    <line x1="780" y1="116" x2="780" y2="160" stroke="#6B7570" stroke-width="2" marker-end="url(#a)"/>
    <line x1="810" y1="160" x2="810" y2="116" stroke="#6B7570" stroke-width="2" marker-end="url(#a)"/>

    <!-- diagnostics -->
    <rect x="540" y="160" width="130" height="56" rx="16" fill="#FFFDF9" stroke="#E4DCCB"/>
    <text x="605" y="184">08 Diagnostics</text><text x="605" y="202" font-size="11" fill="#6B7570">⚙ overlay</text>
    <line x1="720" y1="100" x2="640" y2="160" stroke="#6B7570" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>

    <!-- ready shortcut -->
    <path d="M95 116 L95 300 L795 300 L795 116" fill="none" stroke="#286552" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <text x="445" y="292" font-size="12" fill="#286552">Ready → "Start dinner" (calibration exists) · "Try the demo" → Monitor with ribbon</text>

    <!-- secondary -->
    <rect x="30" y="330" width="130" height="56" rx="16" fill="#FFFDF9" stroke="#E4DCCB"/>
    <text x="95" y="354">07 Settings</text><text x="95" y="372" font-size="11" fill="#6B7570">from 01 / 05</text>
    <rect x="200" y="330" width="150" height="56" rx="16" fill="#FFFDF9" stroke="#E4DCCB"/>
    <text x="275" y="354">09 Data &amp; training</text><text x="275" y="372" font-size="11" fill="#6B7570">sessions · export · delete</text>
    <rect x="390" y="330" width="130" height="56" rx="16" fill="#FFFDF9" stroke="#E4DCCB"/>
    <text x="455" y="354">About</text><text x="455" y="372" font-size="11" fill="#6B7570">version · licences · privacy</text>
    <line x1="95" y1="116" x2="95" y2="330" stroke="#6B7570" stroke-width="1.5" marker-end="url(#a)"/>
  </g>
  <text x="450" y="30" font-size="16" font-weight="600" text-anchor="middle" fill="#1F2A26">Navigation — single Activity, screens swapped with a 180 ms cross-fade</text>
  <text x="450" y="408" font-size="11" text-anchor="middle" fill="#6B7570">Back goes one step left; from Monitor during a session it asks "Stop monitoring?". Setup screens re-enter from Settings ("Mark the table again", "Edit seats").</text>
</svg>
