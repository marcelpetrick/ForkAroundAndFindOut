<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 390" width="844" height="390" font-family="system-ui, sans-serif">
  <!-- Copyright (C) 2026 Marcel Petrick. SPDX-License-Identifier: GPL-3.0-or-later. Screen 08: Diagnostics overlay on Monitor (landscape) -->
  <rect width="844" height="390" rx="28" fill="#F7F2E8"/>
  <rect x="16" y="16" width="520" height="316" rx="16" fill="#2B2F2D"/>
  <!-- table polygon + seat zones -->
  <path d="M90 250 L470 250 L500 320 L60 320 Z" fill="#286552" fill-opacity="0.18" stroke="#9FD9BF" stroke-width="1.5"/>
  <rect x="120" y="150" width="140" height="110" rx="12" fill="none" stroke="#286552" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="310" y="150" width="140" height="110" rx="12" fill="none" stroke="#3E6FA8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- skeletons with confidence dots -->
  <g stroke="#9FD9BF" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="190" cy="110" r="14"/><path d="M160 146 L220 146 M160 146 L146 200 L166 216 M220 146 L236 200 L216 216"/>
  </g>
  <g fill="#9FD9BF"><circle cx="160" cy="146" r="4"/><circle cx="220" cy="146" r="4"/><circle cx="146" cy="200" r="5"/><circle cx="236" cy="200" r="5"/><circle cx="166" cy="216" r="3"/><circle cx="216" cy="216" r="3"/></g>
  <text x="100" y="204" font-size="10" fill="#DCEBE3">L 0.05 CLEAR</text>
  <text x="244" y="204" font-size="10" fill="#DCEBE3">R 0.05 CLEAR</text>
  <g stroke="#E5766B" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="380" cy="116" r="14"/><path d="M350 152 L410 152 M350 152 L344 244 L364 200 M410 152 L426 206 L406 222"/>
  </g>
  <g fill="#E5766B"><circle cx="350" cy="152" r="4"/><circle cx="410" cy="152" r="4"/><circle cx="344" cy="244" r="6"/><circle cx="426" cy="206" r="5"/></g>
  <text x="290" y="262" font-size="10" fill="#F4DAD6">L 0.95 VIOLATION 1.4 s</text>
  <text x="432" y="212" font-size="10" fill="#DCEBE3">R 0.05 CLEAR</text>
  <text x="30" y="36" font-size="11" fill="#CFD6D2">Dot size = confidence · dashed = seat zones · numbers = rule score (not a probability)</text>

  <!-- stats card -->
  <rect x="552" y="16" width="276" height="316" rx="20" fill="#FFFDF9" stroke="#E4DCCB"/>
  <text x="568" y="42" font-size="14" font-weight="600" fill="#1F2A26">Diagnostics</text>
  <g font-size="13" fill="#1F2A26">
    <text x="568" y="70">Processed</text><text x="812" y="70" text-anchor="end">12.3 FPS</text>
    <text x="568" y="92">Inference p50 / p95</text><text x="812" y="92" text-anchor="end">68 / 91 ms</text>
    <text x="568" y="114">Capture → result</text><text x="812" y="114" text-anchor="end">104 ms</text>
    <text x="568" y="136">Dropped (busy)</text><text x="812" y="136" text-anchor="end">41 %</text>
    <text x="568" y="158">Model · delegate</text><text x="812" y="158" text-anchor="end">Full · CPU</text>
    <text x="568" y="180">Analysis · preview</text><text x="812" y="180" text-anchor="end">640×480 · 1280×720</text>
    <text x="568" y="202">Thermal · battery</text><text x="812" y="202" text-anchor="end">Light · 78 % ⚡</text>
    <text x="568" y="224">Trigger / clear</text><text x="812" y="224" text-anchor="end">0.75·1000 / 0.35·500</text>
    <text x="568" y="246">Gap bound</text><text x="812" y="246" text-anchor="end">500 ms</text>
    <text x="568" y="268">Unknown fraction</text><text x="812" y="268" text-anchor="end">S1 2 % · S2 11 %</text>
  </g>
  <rect x="568" y="286" width="118" height="34" rx="12" fill="none" stroke="#6B7570" stroke-dasharray="4 3"/>
  <text x="627" y="308" font-size="13" text-anchor="middle" fill="#6B7570">False alarm</text>
  <rect x="694" y="286" width="118" height="34" rx="12" fill="none" stroke="#6B7570" stroke-dasharray="4 3"/>
  <text x="753" y="308" font-size="13" text-anchor="middle" fill="#6B7570">Missed one</text>
  <text x="422" y="366" font-size="11" text-anchor="middle" fill="#6B7570">Toggled by ⚙ on Monitor. Meant for the supervising adult; hidden by default.</text>
</svg>
