<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" font-family="system-ui, sans-serif">
  <!-- Copyright (C) 2026 Marcel Petrick. SPDX-License-Identifier: GPL-3.0-or-later. Screen 01: Welcome / Ready -->
  <rect width="390" height="844" rx="28" fill="#F7F2E8"/>
  <rect x="0" y="0" width="390" height="44" rx="28" fill="#F7F2E8"/>
  <text x="24" y="30" font-size="13" fill="#6B7570">9:41</text>
  <text x="330" y="30" font-size="13" fill="#6B7570">▮▮▮ 100%</text>

  <!-- wordmark -->
  <circle cx="195" cy="150" r="46" fill="#DCEBE3"/>
  <path d="M182 128 v44 M195 128 v44 M208 128 v44 M182 152 h26" stroke="#286552" stroke-width="5" stroke-linecap="round" fill="none"/>
  <text x="195" y="232" font-size="24" font-weight="600" text-anchor="middle" fill="#1F2A26">Fork Around &amp; Find Out</text>
  <text x="195" y="258" font-size="15" text-anchor="middle" fill="#6B7570">A gentle elbow reminder for the dinner table</text>

  <!-- privacy card -->
  <rect x="20" y="292" width="350" height="150" rx="20" fill="#FFFDF9" stroke="#E4DCCB"/>
  <circle cx="48" cy="324" r="9" fill="#DCEBE3"/><text x="48" y="328" font-size="11" text-anchor="middle" fill="#286552">✓</text>
  <text x="66" y="329" font-size="15" fill="#1F2A26">Everything happens on this phone</text>
  <circle cx="48" cy="360" r="9" fill="#DCEBE3"/><text x="48" y="364" font-size="11" text-anchor="middle" fill="#286552">✓</text>
  <text x="66" y="365" font-size="15" fill="#1F2A26">No pictures are saved — ever</text>
  <circle cx="48" cy="396" r="9" fill="#DCEBE3"/><text x="48" y="400" font-size="11" text-anchor="middle" fill="#286552">✓</text>
  <text x="66" y="401" font-size="15" fill="#1F2A26">No internet, no accounts</text>
  <text x="40" y="430" font-size="13" fill="#6B7570">Camera images are used in memory and discarded.</text>

  <!-- ready status (returning user) -->
  <rect x="20" y="462" width="350" height="72" rx="20" fill="#DCEBE3"/>
  <text x="40" y="490" font-size="15" font-weight="600" fill="#286552">Ready</text>
  <text x="40" y="514" font-size="14" fill="#1F2A26">Calibrated 12 Sep · 2 seats · Main lens</text>

  <!-- primary action -->
  <rect x="20" y="640" width="350" height="56" rx="16" fill="#286552"/>
  <text x="195" y="675" font-size="18" font-weight="600" text-anchor="middle" fill="#FFFFFF">Start dinner</text>
  <!-- secondary -->
  <rect x="20" y="708" width="350" height="48" rx="16" fill="none" stroke="#286552" stroke-width="2"/>
  <text x="195" y="738" font-size="16" text-anchor="middle" fill="#286552">Try the demo (synthetic)</text>

  <!-- footer -->
  <text x="60" y="800" font-size="14" fill="#6B7570">Settings</text>
  <text x="195" y="800" font-size="14" text-anchor="middle" fill="#6B7570">Data &amp; training</text>
  <text x="330" y="800" font-size="14" text-anchor="end" fill="#6B7570">About</text>
  <text x="195" y="826" font-size="11" text-anchor="middle" fill="#6B7570">First run shows "Set up camera" instead of "Start dinner".</text>
</svg>
